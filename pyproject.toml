[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-watch2"
version = "0.1.0"
description = "Discord to tmux bridge for an interactive Claude Code session"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
watch2 = "watch2.__main__:main"

[tool.setuptools]
packages = ["watch2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

