name: Feature request
description: 目的と受入条件を記録する。
body:
- type: markdown
  attributes:
    value: 秘密情報・token・個人情報を貼らないでください。既存Issueを先に検索してください。
- type: textarea
  id: field-1
  attributes:
    label: Problem
  validations:
    required: true
- type: textarea
  id: field-2
  attributes:
    label: Goal
  validations:
    required: true
- type: textarea
  id: field-3
  attributes:
    label: Proposed behavior
  validations:
    required: true
- type: textarea
  id: field-4
  attributes:
    label: Acceptance criteria
  validations:
    required: true
- type: textarea
  id: field-5
  attributes:
    label: Additional context
  validations:
    required: false
